<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-10"> 
      
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5">
          
          <!--ENCABEZADO DEL FORMULARIO-->
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
              <h3 class="fw-bold text-dark mb-1">Registrar Nuevo Alumno</h3>
              <p class="text-muted mb-0">Complete los datos personales y académicos del estudiante.</p>
            </div>
            <button class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1" routerLink="/dashboard/users/students">
              <i class="bi bi-arrow-left"></i> Volver
            </button>
          </div>

          <!--FORMULARIO CONECTADO A LA VARIABLE studentForm-->
          <form [formGroup]="studentForm" (ngSubmit)="onSubmit()">
            
            <!-- DATOS DEL ALUMNO -->
            <div formGroupName="student">
              <h5 class="mb-3 border-bottom pb-2 text-success">Datos Personales</h5>
              <div class="row g-3 mb-4">
                
                <div class="col-12">
                  <label class="form-label fw-semibold">Nombres</label>
                  <input type="text" class="form-control" formControlName="names" placeholder="Ingrese nombres">
                </div>

                <div class="col-md-4">
                  <label class="form-label fw-semibold">Apellido Paterno</label>
                  <input type="text" class="form-control" formControlName="paternalSurname" placeholder="Ingrese primer apellido">
                </div>

                <div class="col-md-4">
                  <label class="form-label fw-semibold">Apellido Materno (Opcional)</label>
                  <input type="text" class="form-control" formControlName="maternalSurname" placeholder="Ingrese segundo apellido">
                </div>
                
                <div class="col-md-4">
                  <label class="form-label fw-semibold">Género</label>
                  <select class="form-select" formControlName="gender">
                    <option value="">Seleccione...</option>
                    <option value="MALE">Masculino</option>
                    <option value="FEMALE">Femenino</option>
                  </select>
                </div>

                <div class="col-md-4">
                  <label class="form-label fw-semibold">Tipo de Documento</label>
                  <select class="form-select" formControlName="documentType">
                    <option value="">Seleccione...</option>
                    <option value="DNI">DNI</option>
                    <option value="CE">CE (Carnet de extranjería)</option>
                    <option value="PASSPORT">PASAPORTE</option>
                  </select>
                </div>
                
                <div class="col-md-4">
                  <label class="form-label fw-semibold">Número de documento</label>
                  <input type="text" class="form-control" formControlName="documentNumber" placeholder="Ingrese número">
                </div>

                <div class="col-md-4">
                  <label class="form-label fw-semibold">Fecha de Nacimiento</label>
                  <input type="date" class="form-control" formControlName="birthdate">
                </div>
              </div>

              <!-- Sub-sección Académica dentro de student -->
              <h6 class="mb-3 mt-4 fw-bold text-secondary"><i class="bi bi-book"></i> Ubicación Académica</h6>
              <div class="row g-3 bg-light p-3 rounded">
                <div class="col-md-4">
                  <label class="form-label fw-semibold">Nivel</label>
                  <select class="form-select" formControlName="level">
                    <option value="">Seleccione...</option>
                    <option value="INITIAL">Inicial</option>
                    <option value="PRIMARY">Primaria</option>
                    <option value="SECONDARY">Secundaria</option>
                  </select>
                </div>

                <div class="col-md-4">
                  <label class="form-label fw-semibold">Grado</label>
                  <input type="text" class="form-control" formControlName="grade" placeholder="Ej. 3ro">
                </div>

                <div class="col-md-4">
                  <label class="form-label fw-semibold">Sección</label>
                  <input type="text" class="form-control" formControlName="section" placeholder="Ej. A">
                </div>
              </div>
            </div>

            <!-- ========================================== -->
            <!-- Botones de Acción -->
            <!-- ========================================== -->
            <div class="d-flex justify-content-end gap-2 mt-5 pt-3 border-top">
              <button type="button" class="btn btn-light px-4" routerLink="/dashboard/users/students">
                Cancelar
              </button>
              <button type="submit" class="btn btn-primary px-4 d-flex align-items-center gap-2">
                <i class="bi bi-save-fill"></i> Guardar Alumno
              </button>
            </div>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>
